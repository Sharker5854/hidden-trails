<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля</title>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 100px auto; padding: 20px; }
        .form-group { margin-bottom: 20px; }
        input[type="password"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background: #28a745; color: white; padding: 12px 24px; border: none; border-radius: 4px; width: 100%; cursor: pointer; }
        .back-link { text-align: center; margin-top: 20px; }
        .message { padding: 10px; margin-bottom: 20px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
    </style>
</head>
<body>
    <h2>Сброс пароля</h2>
    
    {% if token %}
        <p>Введите новый пароль.</p>
        
        {% if message %}
            <div class="message {{ 'success' if success else 'error' }}">{{ message }}</div>
        {% endif %}
        
        <form method="POST">
            <input type="hidden" name="token" value="{{ token }}">
            <div class="form-group">
                <input type="password" name="new_password" placeholder="Новый пароль..." required minlength="4">
            </div>
            <button type="submit">Обновить пароль</button>
        </form>
    {% else %}
        <div class="warning">
            Ссылка недействительна или истекла. 
            <a href="/auth/forgot-password">Запросить новую</a>
        </div>
    {% endif %}
    
    <div class="back-link">
        <a href="/auth/login">← Назад к логину</a>
    </div>
</body>
</html>
