<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Забыли пароль?</title>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 100px auto; padding: 20px; }
        .form-group { margin-bottom: 20px; }
        input[type="email"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 12px 24px; border: none; border-radius: 4px; width: 100%; cursor: pointer; }
        .back-link { text-align: center; margin-top: 20px; }
        .message { padding: 10px; margin-bottom: 20px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h2>Забыли пароль?</h2>
    <p>Введите email — отправим ссылку для сброса.</p>
    
    {% if message %}
        <div class="message {{ 'success' if success else 'error' }}">{{ message }}</div>
    {% endif %}
    
    <form method="POST">
        <div class="form-group">
            <input type="email" name="email" placeholder="your@email.com" required>
        </div>
        <button type="submit">Отправить ссылку</button>
    </form>
    
    <div class="back-link">
        <a href="/auth/login">← Назад к логину</a>
    </div>
</body>
</html>
