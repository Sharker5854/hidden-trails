services:
  users:
    build: users/.
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./users/app:/app/app
      - ./users/alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  postgres:
    image: postgres:17.9
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5





volumes:
  postgres_data:
