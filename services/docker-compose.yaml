services:

  traefik:
    image: traefik:v3.7.0-rc.3
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8088:8088"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/acme.json:/acme.json
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      
      
      - --entrypoints.websecure.address=:443
      
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=traefik-public
      
      - --certificatesresolvers.myresolver.acme.tlschallenge=true
      - --certificatesresolvers.myresolver.acme.email=vovcha5854@gmail.com
      - --certificatesresolvers.myresolver.acme.storage=/acme.json
      
      - --log.level=DEBUG
      - --accesslog=true
    networks:
      - traefik-public



  api:
    build: users/.
    env_file: .env 
    volumes:
      - ./users/app:/app/app
      - ./users/alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.hidden-trails.ru`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=myresolver"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

      # - "traefik.http.middlewares.api-cors.headers.accesscontrolalloworiginlist=https://hidden-trails.ru"
      # - "traefik.http.middlewares.api-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS,PATCH"
      # - "traefik.http.middlewares.api-cors.headers.accesscontrolallowheaders=*"
      # - "traefik.http.middlewares.api-cors.headers.accesscontrolexposeheaders=Content-Length"
      # - "traefik.http.middlewares.api-cors.headers.addvaryheader=true"
      # - "traefik.http.routers.api.middlewares=api-cors"
    networks:
      - traefik-public
      - app


  frontend:
    build:
      context: ../web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    env_file: ../web/.env
    depends_on:
      - api
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`hidden-trails.ru`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - traefik-public
      - app


  postgres:
    image: postgres:17
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-$${POSTGRES_USER}}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  

  redis:
    image: redis:8.6.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app


networks:
  traefik-public:
    external: true
  app:
    external: true


volumes:
  postgres_data:
  redis_data:
